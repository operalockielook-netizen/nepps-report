U.forEach(function(x){

x.score=x.open?s:0;x.pri=!x.open?'':s>=4?'h':s>=2?'m':'l';x.why=why;
});
C.forEach(function(x){x.dd=days(x.expRaw);x.isNew=CMP?(x.fs||'')>since:(base?x.pubRaw>base:x.pubRaw>=latest);x.chg=CMP?chOf(x):[];x.isUpd=!x.isNew&&x.chg.length>0;});
var A=D.awards||[];A.forEach(function(a){a.ms=MS.test(norm(a.t+' '+(a.ctr||[]).join(' ')));a.isNew=CMP?(a.fs||'')>since:a.sub===A[0].sub;});var NEWA=A.filter(function(a){return a.isNew;});var ali=function(a){return '<div class="li" data-a="'+esc(a.ref)+'"><span class="pr '+(a.ms?'h':'l')+'"></span><div style="min-width:0"><div class="t">'+(a.isNew?'<span class="tg new">ΝΕΑ</span>':'')+(a.ms?'<span class="tg ms">MICROSOFT</span>':'')+esc(a.t)+'</div><div class="o"><b>ΑΝΑΔΟΧΟΣ</b>'+esc((a.ctr||[]).join(', ')||'—')+'</div></div><div class="r"><b class="num">'+eurS(a.av)+'</b><span class="cd mu">'+dm(a.sub)+'</span></div></div>';};LS.set('nepps.lastPub',latest);

if((b=t.closest('[data-dayall]'))){state.day=b.dataset.dayall;if(state.src!=='c')state.src='w';state.qv='all';state.st='all';$('#st').value='all';state.lim=40;drawCal();render();$('#feed').scrollIntoView({behavior:'smooth',block:'start'});return;}
if((b=t.closest('[data-clr]'))){var cf=b.dataset.clr;if(cf==='qv')state.qv='all';if(cf==='day'){state.day=null;drawCal();}if(cf==='q'){state.q='';$('#q').value='';state.auto=false;}if(cf==='st'){state.st='open';$('#st').value='open';}if(cf==='cat'){state.cat='';$('#cat').value='';}if(cf==='val'){state.val='0';$('#val').value='0';}state.lim=40;return render();}
if(t.id==='clr'){state.qv='all';state.q='';$('#q').value='';state.cat='';$('#cat').value='';state.st='open';$('#st').value='open';state.val='0';$('#val').value='0';state.sort='pri';state.day=null;state.auto=false;state.lim=40;state.openRow=null;drawCal();return render();}
if((b=t.closest('[data-cal]'))){var cv=+b.dataset.cal;CALW=cv?CALW+cv:0;return drawCal();}
if((b=t.closest('[data-day]'))){var dk=b.dataset.day;state.day=state.day===dk?null:dk;if(state.src!=='c')state.src='w';state.qv='all';state.st='all';$('#st').value='all';state.lim=40;drawCal();render();return;}
if(t.closest('[data-k],#qv button'))state.day=null;
if((b=t.closest('[data-mx]'))){b.previousElementSibling.classList.add('open');return;}if((b=t.closest('[data-k]')))return go(b.dataset.k);

if((b=t.closest('#qv button'))){state.qv=b.dataset.q;state.lim=40;if(state.src==='c'||state.qv==='new'||state.qv==='watch'||state.qv==='ms')state.st='all';$('#st').value=state.st;return render();}
if((b=t.closest('[data-o]'))){state.sort=b.dataset.o;return render();}
if(t.id==='more'){state.lim+=40;return render();}

if((b=t.closest('.li[data-a]'))){state.src='a';state.qv='all';state.q=b.dataset.a;$('#q').value=state.q;state.auto=true;state.openRow=b.dataset.a;[].forEach.call($('#src').children,function(z){z.classList.toggle('on',z.dataset.s==='a');});render();$('#feed').scrollIntoView({behavior:'smooth',block:'start'});return;}if((b=t.closest('.li[data-r]'))){state.src='w';state.qv='all';state.st='all';state.q=b.dataset.r;$('#q').value=state.q;state.auto=true;state.openRow=b.dataset.r;$('#st').value='all';[].forEach.call($('#src').children,function(z){z.classList.toggle('on',z.dataset.s==='w');});render();$('#feed').scrollIntoView({behavior:'smooth',block:'start'});return;}
if((b=t.closest('.tr[data-r]'))){state.openRow=state.openRow===b.dataset.r?null:b.dataset.r;return render();}
});
document.addEventListener('keydown',function(e){var b=e.target.closest&&e.target.closest('.tr[data-r]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.openRow=state.openRow===b.dataset.r?null:b.dataset.r;render();var n=$('.tr[data-r="'+b.dataset.r+'"]');if(n)n.focus();}});
function waitUpd(){var w=0;try{w=+sessionStorage.getItem('nepps.wait')||0;}catch(e){}if(!w||Date.now()-w>12e5||waitUpd.t)return;var el=$('#rf');el.textContent='⏳ Ενημέρωση σε εξέλιξη…';waitUpd.t=setInterval(function(){if(Date.now()-w>12e5){clearInterval(waitUpd.t);el.textContent='↻ Ενημέρωση τώρα';return;}fetch(DSRC+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(h){var m=/"run": "([^"]+)"/.exec(h);if(m&&m[1]!==M.run){try{sessionStorage.removeItem('nepps.wait');}catch(e){}location.reload();}});},30000);}
$('#rf').addEventListener('click',function(e){e.preventDefault();if(waitUpd.t||waitUpd.busy)return;var el=$('#rf');waitUpd.busy=1;el.textContent='⏳ Αποστολή…';fetch('/api/refresh',{method:'POST',credentials:'same-origin'}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));});}).then(function(){waitUpd.busy=0;try{sessionStorage.setItem('nepps.wait',String(Date.now()));}catch(x){}waitUpd();}).catch(function(err){waitUpd.busy=0;el.innerHTML='↻<span class="hm"> Ενημέρωση τώρα</span>';alert('Η ενημέρωση δεν ξεκίνησε ('+err.message+'). Δοκιμάστε ξανά σε λίγο.');});});waitUpd();
$('#q').addEventListener('input',function(e){state.auto=false;state.q=e.target.value;state.lim=40;render();});
$('#srt').addEventListener('change',function(e){state.sort=e.target.value;render();});
['cat','st','val'].forEach(function(id){$('#'+id).addEventListener('change',function(e){if(state.auto){state.auto=false;state.q='';$('#q').value='';}state[id]=e.target.value;state.lim=40;render();});});
render();loadPins();track();

.catch(function(e){console.error(e);$('#app').innerHTML='<div class="empty">Δεν ήταν δυνατή η φόρτωση των δεδομένων. <a href="../">Άνοιγμα κλασικής προβολής</a></div>';});
