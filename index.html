            .sort(function(a,b){return (a.dlRaw||'').localeCompare(b.dlRaw||'');}).slice(0,6);
  $('#soon').innerHTML='<h3>⏳ Προθεσμίες που πλησιάζουν (14 ημέρες)</h3>'+(soon.length?
    '<ul class="feed">'+soon.map(function(x){return '<li><a href="'+esc(x.esidis||x.dekiryxi)+'">'+esc(x.t)+'</a><span class="meta">λήξη '+esc(x.dl)+' · '+esc(x.bud)+'</span></li>';}).join('')+'</ul>'
    :'<p class="empty">Καμία στις επόμενες 14 ημέρες.</p>');

  // ---- activity chart (publications per day, last 30 days) ----
  (function(){
    var counts={}; W.forEach(function(x){ if(x.pubRaw) counts[x.pubRaw]=(counts[x.pubRaw]||0)+1; });
    var days=[], d=new Date(M.today); d.setDate(d.getDate()-29);
    for(var i=0;i<30;i++){
      var iso=d.toISOString().slice(0,10);
      var lbl=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
      days.push({iso:iso,n:counts[iso]||0,lbl:lbl}); d.setDate(d.getDate()+1);
    }
    var max=Math.max.apply(null,[1].concat(days.map(function(x){return x.n;})));
    var bars=days.map(function(x,i){
      var h=Math.round(x.n/max*100), show=(i%7===0||i===29);
      return '<div class="bar" title="'+x.lbl+': '+x.n+' δημοσιεύσεις"><div class="barfill" style="height:'+h+'%"></div>'+(show?'<div class="bx">'+x.lbl+'</div>':'')+'</div>';
    }).join('');
    $('#chartCard').innerHTML='<h3>📈 Δραστηριότητα δημοσιεύσεων (30 ημέρες)</h3><div class="chart">'+bars+'</div>';
  })();

  // ---- filterable tables ----
  var state={view:'all',q:'',minb:0,active:false,sort:'recent'};
  function wFiltered(){
    var a=W.slice();
    if(state.minb>0)a=a.filter(function(x){return (x.bv||0)>=state.minb;});
    if(state.q){var q=state.q;a=a.filter(function(x){return ((x.t+' '+x.org+' '+(x.sys||'')+' '+(x.ref||'')).toLowerCase().indexOf(q)>=0);});}
    a.sort(state.sort==='budget'?function(x,y){return (y.bv||0)-(x.bv||0);}:function(x,y){return (y.pubRaw||'').localeCompare(x.pubRaw||'');});
    return a;
  }
  function cFiltered(){
    var a=C.slice();
    if(state.active)a=a.filter(function(x){return !x.expired;});
    if(state.q){var q=state.q;a=a.filter(function(x){return ((x.t+' '+x.org+' '+x.code).toLowerCase().indexOf(q)>=0);});}
    a.sort(function(x,y){return (y.pubRaw||'').localeCompare(x.pubRaw||'');});  // newest consultation first
    return a;
  }
  function docLinks(x){
    var h='<a href="'+esc(x.dekiryxi)+'">📘 Διακήρυξη</a>';
    if(x.esidis)h+='<br><a href="'+esc(x.esidis)+'">🗂 Τεύχη ΕΣΗΔΗΣ</a>';
    if(x.ref)h+='<br><span class="ref">'+esc(x.ref)+'</span>';
    return h;
  }
  function wRow(x){
    return '<tr><td><b>'+esc(x.t)+'</b>'+
      (x.type?'<br><span class="sub">'+esc(x.type)+'</span>':'')+
      (x.big?'<span class="badge b-big">≥ '+esc(M.label)+'</span>':'<span class="badge b-small">μικρό</span>')+
      (x.post?'<br><span class="warn">⚠️ μετάθεση καταληκτικής ημ/νίας</span>':'')+
      '</td><td>'+esc(x.org)+'</td><td class="num"><b>'+(x.sys?esc(x.sys):'—')+'</b></td>'+
      '<td class="num">'+esc(x.pub)+'</td><td class="num">'+esc(x.bud)+'</td><td class="num">'+esc(x.dl)+'</td>'+
      '<td>'+docLinks(x)+'</td></tr>';
  }
  function cRow(x){
    return '<tr><td><b>'+esc(x.t)+'</b></td><td>'+esc(x.org)+'</td><td class="num">'+esc(x.pub)+'</td>'+
      '<td class="num">'+esc(x.exp)+'</td><td class="num" style="text-align:center">'+esc(x.com)+'</td>'+
      '<td>'+(x.expired?'🔴 Έληξε':'🟢 Ενεργή')+'</td>'+
      '<td><a href="'+esc(x.url)+'" style="color:var(--teal);font-weight:700">🔗 '+esc(x.code)+'</a></td></tr>';
  }
  var WH=['Τίτλος','Φορέας','α/α ΕΣΗΔΗΣ','Δημοσίευση','Π/Υ (χωρίς ΦΠΑ)','Λήξη','Διακήρυξη &amp; Τεύχη'];
  var CH=['Τίτλος','Φορέας','Δημοσιεύθηκε','Λήξη','Σχόλια','Κατάσταση','Σύνδεσμος'];
  function table(accent,head,rows){
    return '<div class="tablewrap"><table style="--accent:'+accent+'"><thead><tr>'+
      head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
      (rows||'<tr><td class="empty" colspan="7">Κανένα αποτέλεσμα.</td></tr>')+'</tbody></table></div>';
  }
  function render(){
    var showW=state.view!=='cons', showC=state.view!=='works';
    if(showW){
      var a=wFiltered();
      $('#worksWrap').innerHTML='<section><h2>📋 Έργα ΤΠΕ <span class="count">('+a.length+')</span></h2>'+
        table('var(--brand)',WH,a.map(wRow).join(''))+'</section>';
    } else { $('#worksWrap').innerHTML=''; }
    if(showC){
      var c=cFiltered();
      $('#consWrap').innerHTML='<section><h2 class="s-teal">🏛️ Διαβουλεύσεις ΤΠΕ <span class="count">('+c.length+')</span></h2>'+
        table('var(--teal)',CH,c.map(cRow).join(''))+'</section>';
    } else { $('#consWrap').innerHTML=''; }
  }
  $('#q').addEventListener('input',function(e){state.q=e.target.value.trim().toLowerCase();render();});
  $('#view').addEventListener('change',function(e){state.view=e.target.value;render();});
  $('#minb').addEventListener('change',function(e){state.minb=+e.target.value;render();});
  $('#sort').addEventListener('change',function(e){state.sort=e.target.value;render();});
  $('#activeOnly').addEventListener('change',function(e){state.active=e.target.checked;render();});
  render();
})();
</script>
</body></html>
