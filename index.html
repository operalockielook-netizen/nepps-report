<html lang="el"><head>
<meta charset="utf-8">

<title>NEPPS ΤΠΕ · Dashboard</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#eef1f5; --card:#ffffff; --ink:#1b2733; --muted:#6b7682; --line:#e6ebf0;
    --brand:#1a5276; --teal:#17a589; --grey:#5d6d7e;
    --series:#2a78d6; --track:#e6eef9;
    --good:#0ca30c; --crit:#d03b3b; --warn:#c0392b;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12161b; --card:#1b2229; --ink:#e6eaee; --muted:#9aa6b2; --line:#2a333d;
      --series:#3987e5; --track:#1e2b3b;
    }
  }
  *{box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;margin:0;color:var(--ink);background:var(--bg);}
  a{color:var(--brand);}
  header{background:var(--brand);color:#fff;padding:22px 16px;}
  header .inner{max-width:1120px;margin:0 auto;}
  header h1{margin:0;font-size:22px;}
  header p{margin:6px 0 0;opacity:.9;font-size:14px;}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 56px;}
  h3{margin:0 0 10px;font-size:15px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .tile .tlabel{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  .tile .tval{font-size:24px;font-weight:700;margin-top:4px;}
  .tile .tsub{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hlgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .feed{list-style:none;margin:0;padding:0;}
  .feed li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .feed li:last-child{border-bottom:none;}
  .feed a{font-weight:600;text-decoration:none;}
  .feed .meta{display:block;color:var(--muted);font-size:12px;margin-top:3px;}
  .empty{color:var(--muted);font-size:13px;margin:6px 0 0;}
  .chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px;}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;}
  .barfill{width:100%;max-width:18px;background:var(--series);border-radius:3px 3px 0 0;min-height:2px;transition:opacity .15s;}
  .bar:hover .barfill{opacity:.7;}
  .bx{position:absolute;bottom:-18px;font-size:10px;color:var(--muted);white-space:nowrap;}
  .chart-wrap{padding-bottom:20px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 6px;}
  .toolbar #q{flex:1 1 240px;padding:11px 14px;font-size:15px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{border:0;background:transparent;color:var(--ink);padding:9px 13px;font-size:13px;cursor:pointer;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--brand);color:#fff;font-weight:700;}
  .toolbar select{padding:9px 11px;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);}
  .toolbar .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
  section{margin-top:18px;}
  section h2{font-size:16px;margin:0 0 6px;padding:9px 13px;background:var(--card);border-left:4px solid var(--brand);border-radius:6px;}
  section h2.s-teal{border-left-color:var(--teal);}
  .count{color:var(--muted);font-weight:400;font-size:13px;}
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
  thead tr{background:var(--accent,var(--brand));color:#fff;}
  th{padding:10px;text-align:left;white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.num{white-space:nowrap;font-variant-numeric:tabular-nums;}
  td.empty{color:var(--muted);text-align:center;padding:20px;}
  .sub{color:var(--muted);font-size:12px;}
  .ref{color:var(--muted);font-size:11px;}
  .warn{color:var(--warn);font-size:12px;font-weight:700;}
  .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:middle;}
  .b-big{background:#1a527615;color:var(--brand);border:1px solid #1a527633;}
  .b-small{background:#5d6d7e15;color:var(--grey);border:1px solid #5d6d7e33;}
  footer{margin-top:30px;color:var(--muted);font-size:12px;}
  @media (max-width:640px){ .hlgrid{grid-template-columns:1fr;} }
</style>

      (x.type?'<br><span class="sub">'+esc(x.type)+'</span>':'')+
      (x.big?'<span class="badge b-big">≥ '+esc(M.label)+'</span>':'<span class="badge b-small">μικρό</span>')+
      (x.post?'<br><span class="warn">⚠️ μετάθεση καταληκτικής ημ/νίας</span>':'')+
      '</td><td>'+esc(x.org)+'</td><td class="num"><b>'+(x.sys?esc(x.sys):'—')+'</b></td>'+
      '<td class="num">'+esc(x.pub)+'</td><td class="num">'+esc(x.bud)+'</td><td class="num">'+esc(x.dl)+'</td>'+
      '<td>'+docLinks(x)+'</td></tr>';
  }
  function cRow(x){
    return '<tr><td><b>'+esc(x.t)+'</b></td><td>'+esc(x.org)+'</td><td class="num">'+esc(x.pub)+'</td>'+
      '<td class="num">'+esc(x.exp)+'</td><td class="num" style="text-align:center">'+esc(x.com)+'</td>'+
      '<td>'+(x.expired?'🔴 Έληξε':'🟢 Ενεργή')+'</td>'+
      '<td><a href="'+esc(x.url)+'" style="color:var(--teal);font-weight:700">🔗 '+esc(x.code)+'</a></td></tr>';
  }
  var WH=['Τίτλος','Φορέας','α/α ΕΣΗΔΗΣ','Δημοσίευση','Π/Υ (χωρίς ΦΠΑ)','Λήξη','Διακήρυξη &amp; Τεύχη'];
  var CH=['Τίτλος','Φορέας','Δημοσιεύθηκε','Λήξη','Σχόλια','Κατάσταση','Σύνδεσμος'];
  function table(accent,head,rows){
    return '<div class="tablewrap"><table style="--accent:'+accent+'"><thead><tr>'+
      head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
      (rows||'<tr><td class="empty" colspan="7">Κανένα αποτέλεσμα.</td></tr>')+'</tbody></table></div>';
  }
  function render(){
    var showW=state.view!=='cons', showC=(state.view==='all'||state.view==='cons');
    if(showW){
      var a=wFiltered(), accent=(state.view==='small')?'var(--grey)':'var(--brand)';
      $('#worksWrap').innerHTML='<section><h2>📋 Έργα ΤΠΕ <span class="count">('+a.length+')</span></h2>'+
        table(accent,WH,a.map(wRow).join(''))+'</section>';
    } else { $('#worksWrap').innerHTML=''; }
    if(showC){
      var c=cFiltered();
      $('#consWrap').innerHTML='<section><h2 class="s-teal">🏛️ Διαβουλεύσεις ΤΠΕ <span class="count">('+c.length+')</span></h2>'+
        table('var(--teal)',CH,c.map(cRow).join(''))+'</section>';
    } else { $('#consWrap').innerHTML=''; }
  }
  $('#q').addEventListener('input',function(e){state.q=e.target.value.trim().toLowerCase();render();});
  $('#minb').addEventListener('change',function(e){state.minb=+e.target.value;render();});
  $('#sort').addEventListener('change',function(e){state.sort=e.target.value;render();});
  $('#activeOnly').addEventListener('change',function(e){state.active=e.target.checked;render();});
  Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'),function(b){
    b.addEventListener('click',function(){
      state.view=b.dataset.v;
      Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'),function(x){x.classList.toggle('on',x===b);});
      render();
    });
  });
  render();
})();
</script>
</body></html>
